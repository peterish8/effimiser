[workspace]
resolver = "2"
members = [
    "crates/ctx-core",
    "crates/ctx-store",
    "crates/ctx-index",
    "crates/ctx-cli",
    "crates/ctx-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/peterish8/effimiser"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
ignore = "0.4"
tiktoken-rs = "0.6"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
